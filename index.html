  if (n >= 10000000) return `₹${(n / 10000000).toFixed(2)} Cr`;

function DonutChart({ invested, gains }) {
  const total = invested + gains || 1;
  const r = 80;
  const strokeWidth = 24;
  const circumference = 2 * Math.PI * r;
  const investedLen = (invested / total) * circumference;
  const gainsLen = (gains / total) * circumference;

  return (
    <svg viewBox="0 0 200 200" width="100%" height="200" role="img" aria-label="Invested vs wealth gained">
      <circle cx="100" cy="100" r={r} fill="none" stroke={LINE} strokeWidth={strokeWidth} />
      <circle
        cx="100" cy="100" r={r} fill="none" stroke={SAGE} strokeWidth={strokeWidth}
        strokeDasharray={`${investedLen} ${circumference - investedLen}`}
        strokeDashoffset={0}
        transform="rotate(-90 100 100)"
        strokeLinecap="butt"
        style={{ transition: "stroke-dasharray 0.5s ease" }}
      />
      <circle
        cx="100" cy="100" r={r} fill="none" stroke={GOLD} strokeWidth={strokeWidth}
        strokeDasharray={`${gainsLen} ${circumference - gainsLen}`}
        strokeDashoffset={-investedLen}
        transform="rotate(-90 100 100)"
        strokeLinecap="butt"
        style={{ transition: "stroke-dasharray 0.5s ease, stroke-dashoffset 0.5s ease" }}
      />
    </svg>
  );
}

const GLOBAL_CSS = `
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---- layout grids (kept out of inline styles so media queries can win) ---- */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; }
.grid-2-uneven { display: grid; grid-template-columns: 1.1fr 0.9fr; }

@media (max-width: 860px) {
  .grid-2, .grid-2-uneven, .grid-3 { grid-template-columns: 1fr; }

}
@media (max-width: 640px) {
  .nav-links { display: none; }
}
@media (max-width: 480px) {
  .grid-4 { grid-template-columns: 1fr; }
  .btn-gold-small { font-size: 12px; padding: 8px 12px; }
  .stat-item { border-bottom: 1px solid rgba(248,246,240,0.1); border-right: none !important; }

}
.stat-item { border-right: 1px solid rgba(248,246,240,0.1); }
.grid-4 > .stat-item:nth-child(4n) { border-right: none; }
@media (max-width: 860px) and (min-width: 481px) {
  .grid-4 > .stat-item:nth-child(2n) { border-right: none; }
}

/* ---- nav ---- */
.nav-links { display: flex; gap: 28px; }
.nav-link { color: ${TEXT}; text-decoration: none; font-size: 14px; position: relative; padding-bottom: 2px; }
.nav-link::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 0; height: 1px; background: ${GOLD}; transition: right 0.25s ease; }
.nav-link:hover::after { right: 0; }

/* ---- buttons ---- */
.btn-gold, .btn-gold-small {

  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.btn-gold-small { padding: 9px 16px; font-size: 13px; }
.btn-gold:hover, .btn-gold-small:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(184,147,74,0.35); }
.btn-ghost {
  background: transparent; color: ${PAPER}; padding: 13px 26px; border-radius: 30px; text-decoration: none;
  font-weight: 600; font-size: 14.5px; border: 1px solid rgba(248,246,240,0.35); display: inline-block;
  transition: background 0.2s ease, transform 0.2s ease;
}
.btn-ghost:hover { background: rgba(248,246,240,0.08); transform: translateY(-2px); }
.btn-ghost-small {
  background: transparent; color: ${INK}; padding: 9px 16px; border-radius: 20px; font-weight: 600;
  font-size: 13px; border: 1px solid ${LINE}; cursor: pointer; transition: background 0.2s ease;
}
.btn-ghost-small:hover { background: ${PAPER}; }

/* ---- filter pills ---- */
.filter-btn {
  background: transparent; border: 1px solid ${LINE}; border-radius: 20px; padding: 8px 18px;
  font-size: 13.5px; cursor: pointer; color: ${TEXT}; font-family: inherit;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
.filter-btn:hover { border-color: ${GOLD}; }
.filter-btn-active { background: ${INK}; border-color: ${INK}; color: ${PAPER}; font-weight: 700; }
.filter-btn-active:hover { border-color: ${INK}; }

/* ---- cards ---- */
.pillar-card, .listing-card {
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.pillar-card:hover, .listing-card:hover {
  transform: translateY(-4px);

}

/* ---- form inputs ---- */
.form-input {
  border: 1px solid ${LINE}; border-radius: 4px; padding: 11px 12px; font-size: 14px;

}
.form-input:focus { outline: none; border-color: ${GOLD}; box-shadow: 0 0 0 3px rgba(184,147,74,0.15); }

.hero-in { opacity: 0; transform: translateY(16px); animation: heroIn 0.7s ease forwards; }

.hero-in[data-delay="7"] { animation-delay: 0.72s; }
.hero-in[data-delay="8"] { animation-delay: 0.78s; }
@keyframes heroIn { to { opacity: 1; transform: translateY(0); } }

/* ---- value pop, used when a computed number/state changes ---- */
.value-pop { animation: valuePop 0.4s ease; }
@keyframes valuePop { 0% { opacity: 0.4; transform: scale(0.96); } 100% { opacity: 1; transform: scale(1); } }

/* ---- whatsapp float ---- */
.whatsapp-float {

}
@keyframes ringPulse {
  0% { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(1.6); opacity: 0; }
}
`;
